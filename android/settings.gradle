pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(rootDir.absolutePath + "/local.properties")
        if (propertiesFile.exists()) {
            properties.load(propertiesFile.newInputStream())
        }
        return properties.getProperty("flutter.sdk")
    }()

    if (flutterSdkPath == null) {
        throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0"
}

include ":app"

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newInputStream())
}

def flutterSdkPath = properties.getProperty("flutter.sdk")
if (flutterSdkPath == null) {
    throw new GradleException("flutter.sdk not defined in local.properties.")
}

def flutterProjectRoot = rootProject.projectDir.parentFile.toPath()

println "Flutter root: $flutterSdkPath"
println "Flutter project root: $flutterProjectRoot"
